<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almanac · Set days</title>
<link rel="stylesheet" href="../../src/base.css">
<link rel="stylesheet" href="../../src/a.css">
<link rel="stylesheet" href="g-final-chrome.css">
<style>

.weekwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 24rem;gap:1.25rem}
.week{background:var(--board);border-radius:var(--r-card);box-shadow:var(--sh-raised);padding:1rem 1.2rem;min-height:0;display:flex;flex-direction:column}
.wgrid{display:grid;grid-template-columns:13rem repeat(7,minmax(0,1fr));gap:.4rem}
.wd{text-align:center;font-size:1.35rem;font-weight:800;padding-bottom:.3rem}
.plan-who{display:flex;align-items:center;gap:.55rem;min-height:4.5rem;padding:0 .5rem;border-radius:var(--r);border:0;background:transparent;text-align:left;cursor:pointer}
.plan-who.on{background:var(--rail);box-shadow:inset 0 0 0 2px var(--ink)}
.plan-who .sw{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--pc);flex:none}
.plan-who .nm{font-size:1.5rem;font-weight:800;display:block;line-height:1.1}
.plan-who .pl{font-size:1.15rem;font-weight:700;color:var(--muted)}
.week{overflow:visible}.cell{position:relative;min-height:4.5rem}
.cell > button{width:100%;height:100%;min-height:4.5rem;border-radius:var(--r);border:2px solid transparent;background:var(--ps);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;cursor:pointer;font:inherit;font-weight:800;font-size:1.25rem;color:var(--ink)}
.cell > button.open{border-color:var(--ink)}
.cell img{width:1.85rem;height:1.85rem}
.pick{position:absolute;top:calc(100% + .25rem);left:0;z-index:5;width:16rem;background:var(--board);border-radius:var(--r-card);box-shadow:var(--sh-dialog);padding:.5rem;display:flex;flex-direction:column;gap:.2rem}
.pick .lab{font-size:1.15rem;font-weight:700;color:var(--muted);padding:.2rem .4rem}
.pick button{min-height:3rem;border:0;border-radius:var(--r);background:transparent;display:flex;align-items:center;gap:.5rem;padding:0 .6rem;font:inherit;font-size:1.25rem;font-weight:700;cursor:pointer;text-align:left}
.pick button.on{background:var(--rail)}
.side .h2{margin-bottom:.3rem}
.planrow{display:flex;align-items:center;gap:.6rem;min-height:3.6rem;padding:.2rem .3rem;border-radius:var(--r)}
.planrow.on{background:var(--rail);box-shadow:inset 0 0 0 2px var(--ink)}

</style>
</head>

  </div>
</header>

    </section>
    <aside class="card side">
      <div class="h2"><span class="sw" style="display:inline-block;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--p-blue);margin-right:.4rem;vertical-align:middle"></span>Connor’s weeks</div>
      <div class="planrow on"><span style="flex:1;font-size:1.5rem;font-weight:800">Usual week</span><span style="font-size:1.15rem;font-weight:700;color:var(--muted)">In use</span></div>
      <div class="field" style="margin-top:1rem"><span class="fl">If there is more than one week</span>

      </div>
      <button class="btn secondary" data-tap style="margin-top:auto"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add a week</button>
